name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".python-version"
      - "pyproject.toml"
      - "skills/**"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".python-version"
      - "pyproject.toml"
      - "skills/**"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    # only uv-managed interpreters: their CPython builds ship with loadable
    # SQLite extension support (sqlite-vec needs it); the macOS runner's
    # preinstalled framework build omits it.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install
        run: uv sync --group dev
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src tests
      - name: CLI smoke
        run: uv run urag --version

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install
        run: uv sync --group dev
      - name: Benchmark fixture + self repo
        run: uv run python benchmarks/run_bench.py --self --yes
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            benchmarks/reports/*.json
            benchmarks/reports/*.html

  cross-platform:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --group dev
      - name: Test
        run: uv run pytest -q
      - name: CLI smoke
        run: uv run urag --version
