name: dev-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "skip the PyPI upload (validation run)"
        required: false

jobs:
  dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Derive dev version
        id: ver
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VER=$(python scripts/dev_version.py | tail -n1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build wheel + sdist
        if: ${{ !startsWith(steps.ver.outputs.version, 'SKIP') }}
        run: uv build
      - name: Publish to PyPI
        if: ${{ !startsWith(steps.ver.outputs.version, 'SKIP') && github.event.inputs.dry_run != 'true' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
