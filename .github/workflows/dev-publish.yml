name: dev-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dev:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Derive dev version
        id: ver
        run: |
          VER=$(python scripts/dev_version.py | tail -n1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build wheel + sdist
        if: ${{ !startsWith(steps.ver.outputs.version, 'SKIP') }}
        run: uv build
      - name: Publish to PyPI
        if: ${{ !startsWith(steps.ver.outputs.version, 'SKIP') }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
      - name: Log published version
        run: echo "urag-cli pre-release: ${{ steps.ver.outputs.version }}"
