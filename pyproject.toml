[project]
name = "urag"
version = "0.1.0"
description = "Universal Repository Agent Graph: structure-aware, token-efficient RAG for projects"
requires-python = ">=3.12"
dependencies = [
    # <0.26: py-tree-sitter 0.26.0 has a use-after-free regression causing
    # segfaults during repo-scale node traversal (issue #472, unfixed).
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "watchdog>=5.0",
    "pathspec>=0.12",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "mcp>=2.0.0",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
]

[project.scripts]
urag = "urag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urag"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.0"]
