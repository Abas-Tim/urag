[project]
name = "urag-cli"
version = "0.1.5"
description = "Universal Repository Agent Graph: structure-aware, token-efficient RAG for projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "urag contributors" }]
keywords = ["rag", "code-search", "mcp", "embedding", "tree-sitter", "agent", "indexing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    # <0.26: py-tree-sitter 0.26.0 has a use-after-free regression causing
    # segfaults during repo-scale node traversal (issue #472, unfixed).
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "watchdog>=5.0",
    "pathspec>=0.12",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "mcp>=2.0.0",
]

[project.scripts]
urag = "urag.cli:app"

[project.urls]
Homepage = "https://github.com/Abas-Tim/urag"
Source = "https://github.com/Abas-Tim/urag"
Issues = "https://github.com/Abas-Tim/urag/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urag"]
force-include = { "skills/urag/SKILL.md" = "urag/skills/urag/SKILL.md" }

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "skills",
    "bootstrap",
    ".github",
    "README.md",
    "pyproject.toml",
    "LICENSE",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.0"]
